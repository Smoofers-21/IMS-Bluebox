name: Build and test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-routing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore BlueBox.sln --locked-mode
      - run: dotnet test BlueBox.sln --no-restore --configuration Release

  sql-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore BlueBox.sln --locked-mode
      - name: Start disposable SQL Server
        shell: bash
        run: |
          password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$password"
          printf 'SQL_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          printf 'BLUEBOX_TEST_SQLSERVER=Server=localhost,1433;User ID=sa;Password=%s;Encrypt=True;TrustServerCertificate=True\n' "$password" >> "$GITHUB_ENV"
          docker run -d --name bluebox-sql -p 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
      - name: Wait for disposable SQL Server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker exec -e SQLCMDPASSWORD="$SQL_TEST_PASSWORD" bluebox-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run real SQL Server integration suite
        run: |
          test -n "$BLUEBOX_TEST_SQLSERVER"
          dotnet test BlueBox.sln --no-restore --configuration Release --logger "trx;LogFileName=sql-server.trx" --results-directory TestResults/SqlServer
      - name: Summarize SQL Server test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('TestResults/SqlServer/sql-server.trx')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## SQL Server test results\n\n')
              if not report.exists():
                  summary.write('No test report was produced; check setup/build steps.\n')
              else:
                  ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
                  root = ET.parse(report).getroot()
                  counters = root.find('t:ResultSummary/t:Counters', ns)
                  if counters is not None:
                      summary.write(f"Passed: {counters.get('passed')}; failed: {counters.get('failed')}; total: {counters.get('total')}.\n\n")
                      print(f"::notice::SQL Server suite: {counters.get('passed')} passed, {counters.get('failed')} failed, {counters.get('total')} total.")
                  for test in root.findall('t:Results/t:UnitTestResult', ns):
                      if test.get('outcome') != 'Failed':
                          continue
                      name = test.get('testName', 'Test')
                      message = test.findtext('t:Output/t:ErrorInfo/t:Message', '', ns)
                      stack = test.findtext('t:Output/t:ErrorInfo/t:StackTrace', '', ns)
                      details = (name + '\n' + message + '\n' + stack)[:6000].replace('```', "'''")
                      summary.write('```text\n' + details + '\n```\n\n')
                      annotation = details.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error::' + annotation)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-server-test-results
          path: TestResults/SqlServer/*.trx
          if-no-files-found: ignore
      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f bluebox-sql
