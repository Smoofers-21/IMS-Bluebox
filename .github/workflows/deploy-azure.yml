name: Deploy BlueBox to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluebox-azure-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      BLUEBOX_PRIVATE_CONFIG: ""
      BLUEBOX_TEST_SQLSERVER: ""
    steps:
      - name: Require main and passing CI for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Deployments must run from main. Select main in Run workflow."
            exit 1
          fi
          if [[ ! "$AZURE_WEBAPP_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{0,58}[a-zA-Z0-9]$ ]]; then
            echo "::error::Set the AZURE_WEBAPP_NAME repository variable to the existing Azure app's Name, without a URL."
            exit 1
          fi
          passed="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f per_page=1 \
            --jq '.workflow_runs[0] | .status == "completed" and .conclusion == "success"')"
          if [[ "$passed" != "true" ]]; then
            echo "::error::Wait for Build and test to pass on this main commit, then run deployment again."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore BlueBox.sln --locked-mode
      - name: Run local tests without a database connection
        run: dotnet test BlueBox.sln --no-restore --configuration Release
      - name: Publish framework-dependent application
        run: >-
          dotnet publish src/BlueBox.Web/BlueBox.Web.csproj
          --configuration Release --no-restore --self-contained false
          -p:UseAppHost=false --output "${{ runner.temp }}/bluebox-publish"
      - name: Package application at the ZIP root
        shell: bash
        working-directory: ${{ runner.temp }}/bluebox-publish
        run: |
          test -s BlueBox.Web.dll
          test -s web.config
          test -s wwwroot/css/site.css
          zip -q -r "$RUNNER_TEMP/bluebox-webapp.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: bluebox-webapp
          path: ${{ runner.temp }}/bluebox-webapp.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: azure-portfolio
      url: https://bluebox-ims-portfolio-hkc4ckdjhtd5a2gk.westus3-01.azurewebsites.net
    steps:
      - name: Check private deployment credential is configured
        shell: bash
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [[ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]]; then
            echo "::error::Add AZURE_WEBAPP_PUBLISH_PROFILE as a GitHub Actions repository secret. Never put it in a file in the repository."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: bluebox-webapp
          path: ${{ runner.temp }}/bluebox-artifact
      - name: Deploy to the existing Azure web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/bluebox-artifact/bluebox-webapp.zip
